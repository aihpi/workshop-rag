<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 240" role="img" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title>Normalization: fix encoding artifacts before search</title>
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#7d8590"/>
    </marker>
  </defs>
  <text x="430" y="30" text-anchor="middle" font-size="19" font-weight="700" fill="#7d8590">Normalization: fix encoding artifacts before search</text>

  <!-- broken chunk -->
  <rect x="36" y="62" width="340" height="128" rx="8" fill="#ffebe9" stroke="#cf222e" stroke-width="1.5"/>
  <text x="52" y="86" font-size="11" fill="#57606a">chunk as extracted (raw)</text>
  <text x="52" y="114" font-size="13" font-family="ui-monospace, Menlo, monospace" fill="#1f2328">Schl<tspan fill="#cf222e" font-weight="700">/C231</tspan>ssel und</text>
  <text x="52" y="132" font-size="13" font-family="ui-monospace, Menlo, monospace" fill="#1f2328">Verschl<tspan fill="#cf222e" font-weight="700">/C231</tspan>sselung ...</text>
  <text x="52" y="168" font-size="13" fill="#cf222e">✗ a search for "Schlüssel" finds nothing</text>

  <!-- arrow -->
  <line x1="388" y1="126" x2="466" y2="126" stroke="#7d8590" stroke-width="2" marker-end="url(#arw)"/>
  <text x="428" y="105" text-anchor="middle" font-size="12" fill="#7d8590">fix artifacts</text>
  <text x="428" y="152" text-anchor="middle" font-size="12" font-family="ui-monospace, Menlo, monospace" fill="#7d8590">/C231 → ü</text>

  <!-- clean chunk -->
  <rect x="480" y="62" width="340" height="128" rx="8" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="496" y="86" font-size="11" fill="#57606a">chunk after normalization</text>
  <text x="496" y="114" font-size="13" font-family="ui-monospace, Menlo, monospace" fill="#1f2328">Schl<tspan fill="#1a7f37" font-weight="700">ü</tspan>ssel und</text>
  <text x="496" y="132" font-size="13" font-family="ui-monospace, Menlo, monospace" fill="#1f2328">Verschl<tspan fill="#1a7f37" font-weight="700">ü</tspan>sselung ...</text>
  <text x="496" y="168" font-size="13" fill="#1a7f37">✓ retrieval works</text>

  <text x="430" y="222" text-anchor="middle" font-size="12" fill="#7d8590">Same content — but broken characters push a chunk away from the questions it should answer.</text>
</svg>
