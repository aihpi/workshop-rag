<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" role="img" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title>Figures are invisible to text extraction until a VLM describes them</title>
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#7d8590"/>
    </marker>
  </defs>
  <text x="430" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#7d8590">Figures are invisible to text search — until a VLM describes them</text>

  <!-- col 1: original document -->
  <rect x="40" y="66" width="190" height="200" rx="6" fill="#ffffff" stroke="#8b949e"/>
  <rect x="54" y="82" width="120" height="6" fill="#57606a"/>
  <rect x="54" y="98" width="162" height="4" fill="#afb8c1"/>
  <rect x="54" y="110" width="162" height="4" fill="#afb8c1"/>
  <rect x="54" y="122" width="130" height="4" fill="#afb8c1"/>
  <!-- embedded figure -->
  <rect x="54" y="138" width="162" height="62" rx="4" fill="#ddf4ff" stroke="#0969da"/>
  <circle cx="100" cy="169" r="14" fill="none" stroke="#0969da" stroke-width="1.5"/>
  <rect x="130" y="152" width="24" height="14" fill="none" stroke="#0969da" stroke-width="1.5"/>
  <rect x="130" y="176" width="24" height="14" fill="none" stroke="#0969da" stroke-width="1.5"/>
  <line x1="114" y1="164" x2="128" y2="159" stroke="#0969da"/>
  <line x1="114" y1="174" x2="128" y2="183" stroke="#0969da"/>
  <line x1="154" y1="159" x2="176" y2="169" stroke="#0969da"/>
  <line x1="154" y1="183" x2="176" y2="169" stroke="#0969da"/>
  <circle cx="184" cy="169" r="6" fill="none" stroke="#0969da" stroke-width="1.5"/>
  <text x="135" y="214" text-anchor="middle" font-size="10" fill="#7d8590">Figure 1</text>
  <rect x="54" y="226" width="162" height="4" fill="#afb8c1"/>
  <rect x="54" y="238" width="140" height="4" fill="#afb8c1"/>
  <rect x="54" y="250" width="162" height="4" fill="#afb8c1"/>
  <text x="135" y="286" text-anchor="middle" font-size="11" fill="#7d8590">original page</text>

  <!-- arrow 1 -->
  <line x1="240" y1="166" x2="300" y2="166" stroke="#7d8590" stroke-width="2" marker-end="url(#arw)"/>
  <text x="270" y="152" text-anchor="middle" font-size="11" fill="#7d8590">text</text>
  <text x="270" y="186" text-anchor="middle" font-size="11" fill="#7d8590">extraction</text>

  <!-- col 2: extracted, gap -->
  <rect x="310" y="66" width="190" height="200" rx="6" fill="#ffffff" stroke="#8b949e"/>
  <rect x="324" y="82" width="120" height="6" fill="#57606a"/>
  <rect x="324" y="98" width="162" height="4" fill="#afb8c1"/>
  <rect x="324" y="110" width="162" height="4" fill="#afb8c1"/>
  <rect x="324" y="122" width="130" height="4" fill="#afb8c1"/>
  <rect x="324" y="138" width="162" height="62" rx="4" fill="none" stroke="#cf222e" stroke-dasharray="6 4" stroke-width="1.5"/>
  <text x="405" y="173" text-anchor="middle" font-size="11" fill="#cf222e">(nothing here)</text>
  <rect x="324" y="226" width="162" height="4" fill="#afb8c1"/>
  <rect x="324" y="238" width="140" height="4" fill="#afb8c1"/>
  <rect x="324" y="250" width="162" height="4" fill="#afb8c1"/>
  <text x="405" y="286" text-anchor="middle" font-size="12" fill="#cf222e">✗ invisible to text search</text>

  <!-- arrow 2 with VLM chip -->
  <line x1="510" y1="166" x2="590" y2="166" stroke="#7d8590" stroke-width="2" marker-end="url(#arw)"/>
  <rect x="522" y="150" width="56" height="26" rx="8" fill="#fbefff" stroke="#8250df" stroke-width="1.5"/>
  <text x="550" y="168" text-anchor="middle" font-size="12" font-weight="600" fill="#8250df">VLM</text>
  <text x="550" y="196" text-anchor="middle" font-size="11" fill="#8250df">+ image annotation</text>

  <!-- col 3: gap filled -->
  <rect x="600" y="66" width="190" height="200" rx="6" fill="#ffffff" stroke="#8b949e"/>
  <rect x="614" y="82" width="120" height="6" fill="#57606a"/>
  <rect x="614" y="98" width="162" height="4" fill="#afb8c1"/>
  <rect x="614" y="110" width="162" height="4" fill="#afb8c1"/>
  <rect x="614" y="122" width="130" height="4" fill="#afb8c1"/>
  <rect x="614" y="138" width="162" height="62" rx="4" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="695" y="156" text-anchor="middle" font-size="10" font-style="italic" fill="#1f2328">"Diagram of an LSTM</text>
  <text x="695" y="170" text-anchor="middle" font-size="10" font-style="italic" fill="#1f2328">memory cell with input,</text>
  <text x="695" y="184" text-anchor="middle" font-size="10" font-style="italic" fill="#1f2328">output and forget gates."</text>
  <rect x="614" y="226" width="162" height="4" fill="#afb8c1"/>
  <rect x="614" y="238" width="140" height="4" fill="#afb8c1"/>
  <rect x="614" y="250" width="162" height="4" fill="#afb8c1"/>
  <text x="695" y="286" text-anchor="middle" font-size="12" fill="#1a7f37">✓ description is searchable text</text>

  <text x="430" y="316" text-anchor="middle" font-size="12" fill="#7d8590">A question about "the architecture diagram" can now actually find the figure.</text>
</svg>
