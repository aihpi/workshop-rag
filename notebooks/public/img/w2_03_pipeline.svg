<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 310" role="img" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title>The RAG pipeline: from PDF to a cited answer</title>
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#7d8590"/>
    </marker>
    <marker id="arwB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#0969da"/>
    </marker>
    <marker id="arwG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#1a7f37"/>
    </marker>
  </defs>
  <text x="430" y="30" text-anchor="middle" font-size="19" font-weight="700" fill="#7d8590">From PDF to cited answer — the RAG pipeline</text>

  <!-- stage 1: PDF -->
  <rect x="24" y="62" width="120" height="84" rx="8" fill="#ffffff" stroke="#8b949e" stroke-width="1.5"/>
  <text x="84" y="88" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">PDF</text>
  <text x="84" y="108" text-anchor="middle" font-size="10" font-family="ui-monospace, Menlo, monospace" fill="#57606a">standard_200_1</text>
  <text x="84" y="121" text-anchor="middle" font-size="10" font-family="ui-monospace, Menlo, monospace" fill="#57606a">.pdf</text>

  <!-- stage 2: Docling -->
  <rect x="164" y="62" width="120" height="84" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="224" y="88" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">Docling</text>
  <text x="224" y="108" text-anchor="middle" font-size="11" fill="#57606a">readable text</text>
  <text x="224" y="122" text-anchor="middle" font-size="11" fill="#57606a">+ structure</text>

  <!-- stage 3: Chunking -->
  <rect x="304" y="62" width="120" height="84" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="364" y="88" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">Chunking</text>
  <text x="364" y="108" text-anchor="middle" font-size="11" fill="#57606a">knowledge</text>
  <text x="364" y="122" text-anchor="middle" font-size="11" fill="#57606a">snippets</text>

  <!-- stage 4: Embeddings -->
  <rect x="444" y="62" width="120" height="84" rx="8" fill="#fbefff" stroke="#8250df" stroke-width="1.5"/>
  <text x="504" y="88" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">Embeddings</text>
  <text x="504" y="108" text-anchor="middle" font-size="11" fill="#57606a">points on a map</text>
  <text x="504" y="122" text-anchor="middle" font-size="11" fill="#57606a">of meanings</text>

  <!-- stage 5: Qdrant -->
  <rect x="584" y="62" width="120" height="84" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="644" y="88" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">Qdrant</text>
  <text x="644" y="108" text-anchor="middle" font-size="11" fill="#57606a">searchable</text>
  <text x="644" y="122" text-anchor="middle" font-size="11" fill="#57606a">vector database</text>

  <!-- stage 6: RAG answer -->
  <rect x="724" y="62" width="115" height="84" rx="8" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="781" y="88" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">RAG answer</text>
  <text x="781" y="108" text-anchor="middle" font-size="11" fill="#57606a">with page</text>
  <text x="781" y="122" text-anchor="middle" font-size="11" fill="#57606a">citations</text>

  <!-- flow arrows -->
  <line x1="146" y1="104" x2="161" y2="104" stroke="#7d8590" stroke-width="2" marker-end="url(#arw)"/>
  <line x1="286" y1="104" x2="301" y2="104" stroke="#7d8590" stroke-width="2" marker-end="url(#arw)"/>
  <line x1="426" y1="104" x2="441" y2="104" stroke="#7d8590" stroke-width="2" marker-end="url(#arw)"/>
  <line x1="566" y1="104" x2="581" y2="104" stroke="#7d8590" stroke-width="2" marker-end="url(#arw)"/>
  <line x1="706" y1="104" x2="721" y2="104" stroke="#7d8590" stroke-width="2" marker-end="url(#arw)"/>

  <!-- question enters at Qdrant -->
  <rect x="440" y="210" width="230" height="46" rx="8" fill="#ffffff" stroke="#0969da" stroke-width="1.5"/>
  <text x="555" y="228" text-anchor="middle" font-size="11" fill="#0969da">your question</text>
  <text x="555" y="245" text-anchor="middle" font-size="12" font-family="ui-monospace, Menlo, monospace" fill="#1f2328">"Was ist ein ISMS?"</text>
  <line x1="608" y1="207" x2="636" y2="152" stroke="#0969da" stroke-width="2" marker-end="url(#arwB)"/>

  <!-- answer exits from stage 6 -->
  <line x1="781" y1="149" x2="781" y2="202" stroke="#1a7f37" stroke-width="2" marker-end="url(#arwG)"/>
  <rect x="694" y="208" width="150" height="58" rx="8" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="754" y="228" text-anchor="middle" font-size="11" fill="#57606a">answer …</text>
  <rect x="712" y="238" width="52" height="18" rx="9" fill="#0969da"/>
  <text x="738" y="251" text-anchor="middle" font-size="11" fill="#ffffff">p. 12</text>
  <text x="800" y="251" font-size="11" fill="#7d8590">cited</text>

  <text x="28" y="232" font-size="12" fill="#7d8590">Sections 1–5 build the left half (ingestion) —</text>
  <text x="28" y="249" font-size="12" fill="#7d8590">sections 6–7 run the right half (retrieval + answer).</text>
  <text x="430" y="296" text-anchor="middle" font-size="12" fill="#7d8590">RAG = an open-book test: the model looks things up before it answers.</text>
</svg>
