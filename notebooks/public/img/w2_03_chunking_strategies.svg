<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 430" role="img" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title>Five ways to cut the same document into chunks</title>
  <text x="430" y="30" text-anchor="middle" font-size="19" font-weight="700" fill="#7d8590">Five ways to cut the same document</text>

  <!-- ===== column template: document card with 2 headings and text bars ===== -->
  <!-- column 1: markdown_headers (x=40) -->
  <text x="110" y="72" text-anchor="middle" font-size="12" font-family="ui-monospace, Menlo, monospace" font-weight="700" fill="#0969da">markdown_</text>
  <text x="110" y="86" text-anchor="middle" font-size="12" font-family="ui-monospace, Menlo, monospace" font-weight="700" fill="#0969da">headers</text>
  <g>
    <rect x="40" y="100" width="140" height="240" rx="6" fill="#ffffff" stroke="#8b949e"/>
    <rect x="52" y="116" width="80" height="8" fill="#57606a"/>
    <rect x="52" y="136" width="116" height="4" fill="#afb8c1"/>
    <rect x="52" y="148" width="116" height="4" fill="#afb8c1"/>
    <rect x="52" y="160" width="100" height="4" fill="#afb8c1"/>
    <rect x="52" y="172" width="116" height="4" fill="#afb8c1"/>
    <rect x="52" y="184" width="90" height="4" fill="#afb8c1"/>
    <rect x="52" y="216" width="70" height="8" fill="#57606a"/>
    <rect x="52" y="236" width="116" height="4" fill="#afb8c1"/>
    <rect x="52" y="248" width="106" height="4" fill="#afb8c1"/>
    <rect x="52" y="260" width="116" height="4" fill="#afb8c1"/>
    <rect x="52" y="272" width="116" height="4" fill="#afb8c1"/>
    <rect x="52" y="284" width="116" height="4" fill="#afb8c1"/>
    <rect x="52" y="296" width="116" height="4" fill="#afb8c1"/>
    <rect x="52" y="308" width="80" height="4" fill="#afb8c1"/>
    <line x1="40" y1="110" x2="180" y2="110" stroke="#0969da" stroke-width="2.5"/>
    <line x1="40" y1="208" x2="180" y2="208" stroke="#0969da" stroke-width="2.5"/>
  </g>
  <text x="110" y="362" text-anchor="middle" font-size="11" fill="#7d8590">splits the Markdown</text>
  <text x="110" y="376" text-anchor="middle" font-size="11" fill="#7d8590">at ## headings</text>

  <!-- column 2: json_text_no_chunk (x=205) -->
  <text x="275" y="72" text-anchor="middle" font-size="12" font-family="ui-monospace, Menlo, monospace" font-weight="700" fill="#7d8590">json_text_</text>
  <text x="275" y="86" text-anchor="middle" font-size="12" font-family="ui-monospace, Menlo, monospace" font-weight="700" fill="#7d8590">no_chunk</text>
  <g>
    <rect x="205" y="100" width="140" height="240" rx="6" fill="#ffffff" stroke="#8b949e"/>
    <rect x="217" y="116" width="80" height="8" fill="#57606a"/>
    <rect x="217" y="136" width="116" height="4" fill="#afb8c1"/>
    <rect x="217" y="148" width="116" height="4" fill="#afb8c1"/>
    <rect x="217" y="160" width="100" height="4" fill="#afb8c1"/>
    <rect x="217" y="172" width="116" height="4" fill="#afb8c1"/>
    <rect x="217" y="184" width="90" height="4" fill="#afb8c1"/>
    <rect x="217" y="216" width="70" height="8" fill="#57606a"/>
    <rect x="217" y="236" width="116" height="4" fill="#afb8c1"/>
    <rect x="217" y="248" width="106" height="4" fill="#afb8c1"/>
    <rect x="217" y="260" width="116" height="4" fill="#afb8c1"/>
    <rect x="217" y="272" width="116" height="4" fill="#afb8c1"/>
    <rect x="217" y="284" width="116" height="4" fill="#afb8c1"/>
    <rect x="217" y="296" width="116" height="4" fill="#afb8c1"/>
    <rect x="217" y="308" width="80" height="4" fill="#afb8c1"/>
    <line x1="205" y1="110" x2="345" y2="110" stroke="#7d8590" stroke-width="1.5"/>
    <line x1="205" y1="130" x2="345" y2="130" stroke="#7d8590" stroke-width="1.5"/>
    <line x1="205" y1="154" x2="345" y2="154" stroke="#7d8590" stroke-width="1.5"/>
    <line x1="205" y1="178" x2="345" y2="178" stroke="#7d8590" stroke-width="1.5"/>
    <line x1="205" y1="196" x2="345" y2="196" stroke="#7d8590" stroke-width="1.5"/>
    <line x1="205" y1="230" x2="345" y2="230" stroke="#7d8590" stroke-width="1.5"/>
    <line x1="205" y1="254" x2="345" y2="254" stroke="#7d8590" stroke-width="1.5"/>
    <line x1="205" y1="278" x2="345" y2="278" stroke="#7d8590" stroke-width="1.5"/>
    <line x1="205" y1="302" x2="345" y2="302" stroke="#7d8590" stroke-width="1.5"/>
  </g>
  <text x="275" y="362" text-anchor="middle" font-size="11" fill="#7d8590">every text block</text>
  <text x="275" y="376" text-anchor="middle" font-size="11" fill="#7d8590">its own piece</text>

  <!-- column 3: json_structured_sections (x=370) -->
  <text x="440" y="72" text-anchor="middle" font-size="12" font-family="ui-monospace, Menlo, monospace" font-weight="700" fill="#1a7f37">json_struct.</text>
  <text x="440" y="86" text-anchor="middle" font-size="12" font-family="ui-monospace, Menlo, monospace" font-weight="700" fill="#1a7f37">sections</text>
  <g>
    <rect x="370" y="100" width="140" height="240" rx="6" fill="#ffffff" stroke="#8b949e"/>
    <rect x="382" y="116" width="80" height="8" fill="#57606a"/>
    <rect x="382" y="136" width="116" height="4" fill="#afb8c1"/>
    <rect x="382" y="148" width="116" height="4" fill="#afb8c1"/>
    <rect x="382" y="160" width="100" height="4" fill="#afb8c1"/>
    <rect x="382" y="172" width="116" height="4" fill="#afb8c1"/>
    <rect x="382" y="184" width="90" height="4" fill="#afb8c1"/>
    <rect x="382" y="216" width="70" height="8" fill="#57606a"/>
    <rect x="382" y="236" width="116" height="4" fill="#afb8c1"/>
    <rect x="382" y="248" width="106" height="4" fill="#afb8c1"/>
    <rect x="382" y="260" width="116" height="4" fill="#afb8c1"/>
    <rect x="382" y="272" width="116" height="4" fill="#afb8c1"/>
    <rect x="382" y="284" width="116" height="4" fill="#afb8c1"/>
    <rect x="382" y="296" width="116" height="4" fill="#afb8c1"/>
    <rect x="382" y="308" width="80" height="4" fill="#afb8c1"/>
    <line x1="370" y1="110" x2="510" y2="110" stroke="#1a7f37" stroke-width="2.5"/>
    <line x1="370" y1="208" x2="510" y2="208" stroke="#1a7f37" stroke-width="2.5"/>
  </g>
  <text x="440" y="362" text-anchor="middle" font-size="11" fill="#7d8590">groups JSON blocks</text>
  <text x="440" y="376" text-anchor="middle" font-size="11" fill="#7d8590">heading → heading</text>

  <!-- column 4: hybrid_docling (x=535) -->
  <text x="605" y="72" text-anchor="middle" font-size="12" font-family="ui-monospace, Menlo, monospace" font-weight="700" fill="#8250df">hybrid_</text>
  <text x="605" y="86" text-anchor="middle" font-size="12" font-family="ui-monospace, Menlo, monospace" font-weight="700" fill="#8250df">docling</text>
  <g>
    <rect x="535" y="100" width="140" height="240" rx="6" fill="#ffffff" stroke="#8b949e"/>
    <rect x="547" y="116" width="80" height="8" fill="#57606a"/>
    <rect x="547" y="136" width="116" height="4" fill="#afb8c1"/>
    <rect x="547" y="148" width="116" height="4" fill="#afb8c1"/>
    <rect x="547" y="160" width="100" height="4" fill="#afb8c1"/>
    <rect x="547" y="172" width="116" height="4" fill="#afb8c1"/>
    <rect x="547" y="184" width="90" height="4" fill="#afb8c1"/>
    <rect x="547" y="216" width="70" height="8" fill="#57606a"/>
    <rect x="547" y="236" width="116" height="4" fill="#afb8c1"/>
    <rect x="547" y="248" width="106" height="4" fill="#afb8c1"/>
    <rect x="547" y="260" width="116" height="4" fill="#afb8c1"/>
    <rect x="547" y="272" width="116" height="4" fill="#afb8c1"/>
    <rect x="547" y="284" width="116" height="4" fill="#afb8c1"/>
    <rect x="547" y="296" width="116" height="4" fill="#afb8c1"/>
    <rect x="547" y="308" width="80" height="4" fill="#afb8c1"/>
    <line x1="535" y1="110" x2="675" y2="110" stroke="#8250df" stroke-width="2.5"/>
    <line x1="535" y1="208" x2="675" y2="208" stroke="#8250df" stroke-width="2.5"/>
    <line x1="535" y1="278" x2="675" y2="278" stroke="#bc4c00" stroke-width="2.5" stroke-dasharray="6 4"/>
  </g>
  <text x="679" y="282" font-size="10" fill="#bc4c00">512</text>
  <text x="679" y="293" font-size="10" fill="#bc4c00">tokens</text>
  <text x="605" y="362" text-anchor="middle" font-size="11" fill="#7d8590">structure cuts +</text>
  <text x="605" y="376" text-anchor="middle" font-size="11" fill="#7d8590">token-budget cuts</text>

  <!-- column 5: semantic (x=700) -->
  <text x="770" y="79" text-anchor="middle" font-size="12" font-family="ui-monospace, Menlo, monospace" font-weight="700" fill="#bc4c00">semantic</text>
  <g>
    <rect x="700" y="100" width="140" height="240" rx="6" fill="#ffffff" stroke="#8b949e"/>
    <rect x="712" y="116" width="80" height="8" fill="#57606a"/>
    <rect x="712" y="136" width="116" height="4" fill="#afb8c1"/>
    <rect x="712" y="148" width="116" height="4" fill="#afb8c1"/>
    <rect x="712" y="160" width="100" height="4" fill="#afb8c1"/>
    <rect x="712" y="172" width="116" height="4" fill="#afb8c1"/>
    <rect x="712" y="184" width="90" height="4" fill="#afb8c1"/>
    <rect x="712" y="216" width="70" height="8" fill="#57606a"/>
    <rect x="712" y="236" width="116" height="4" fill="#afb8c1"/>
    <rect x="712" y="248" width="106" height="4" fill="#afb8c1"/>
    <rect x="712" y="260" width="116" height="4" fill="#afb8c1"/>
    <rect x="712" y="272" width="116" height="4" fill="#afb8c1"/>
    <rect x="712" y="284" width="116" height="4" fill="#afb8c1"/>
    <rect x="712" y="296" width="116" height="4" fill="#afb8c1"/>
    <rect x="712" y="308" width="80" height="4" fill="#afb8c1"/>
    <line x1="700" y1="166" x2="840" y2="166" stroke="#bc4c00" stroke-width="2.5"/>
    <line x1="700" y1="290" x2="840" y2="290" stroke="#bc4c00" stroke-width="2.5"/>
  </g>
  <text x="770" y="362" text-anchor="middle" font-size="11" fill="#7d8590">cuts at topic shifts —</text>
  <text x="770" y="376" text-anchor="middle" font-size="11" fill="#7d8590">ignores the layout</text>

  <text x="430" y="412" text-anchor="middle" font-size="13" fill="#7d8590">Same document — five different chunk boundaries. There is no universally correct cut.</text>
</svg>
